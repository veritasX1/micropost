<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>micro — #{{ post.id }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="alternate" type="application/rss+xml" title="micro" href="{{ url_for('feed') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('timeline') }}">micro</a></h1>
    {% if floppy %}
    <div class="floppy-gauge" title="Backup medium usage">
      <span class="floppy-gauge-label">Floppy:</span>
      <span class="floppy-bar">
        <span class="floppy-bar-fill" style="width: {{ floppy.percent }}%;"></span>
        <span class="floppy-bar-pct">{{ floppy.percent }}%</span>
      </span>
      <span class="floppy-gauge-usage">{{ floppy.used_display }} / {{ floppy.total_display }}</span>
    </div>
    {% endif %}
    <a class="feed-link" href="{{ url_for('feed') }}">RSS</a>
  </header>

  <div class="layout">
  <main>
    {% include "_post.html" %}
    <p><a href="{{ url_for('timeline') }}">← all posts</a></p>
  </main>
  {% include "_archive.html" %}
  </div>

  <footer>
    <p>&mdash;</p>
  </footer>
</body>
</html>
