<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>micro</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="alternate" type="application/rss+xml" title="micro" href="{{ url_for('feed') }}">
</head>
<body>
  <header>
    <h1>micro</h1>
    <a class="feed-link" href="{{ url_for('feed') }}">RSS</a>
  </header>

  <main>
    {% if not posts %}
      <p class="empty">nothing here yet.</p>
    {% endif %}

    {% for post in posts %}
      {% include "_post.html" %}
    {% endfor %}
  </main>

  <footer>
    <p>&mdash;</p>
  </footer>
</body>
</html>
